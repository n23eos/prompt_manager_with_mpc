<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Quick Palette</title>
<style>
  :root {
    --bg: rgba(28, 29, 33, 0.92);
    --bg3: #2a2b30;
    --border: #3a3b41;
    --text: #eceff4;
    --text2: #9a9ba2;
    --accent: #5865f2;
    --star: #f5c451;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text); overflow: hidden; user-select: none;
  }
  .panel {
    height: 100%; display: flex; flex-direction: column;
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45); overflow: hidden;
  }
  .searchrow { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .searchrow .icon { color: var(--text2); font-size: 15px; }
  input#q {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 17px;
  }
  input#q::placeholder { color: var(--text2); }
  .results { flex: 1; overflow-y: auto; padding: 6px; }
  .row {
    padding: 8px 12px; border-radius: 8px; cursor: pointer;
    display: flex; flex-direction: column; gap: 1px;
  }
  .row.sel { background: var(--accent); }
  .row .t { font-size: 13.5px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .row .star { color: var(--star); font-size: 11px; }
  .row.sel .star { color: #fff; }
  .row .p { font-size: 11.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.sel .p { color: rgba(255,255,255,.75); }
  .empty { text-align: center; color: var(--text2); padding: 30px; font-size: 13px; }
  .footer {
    padding: 7px 14px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text2); display: flex; gap: 14px;
  }
  kbd {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 4px;
    padding: 0 5px; font-family: inherit; font-size: 10px;
  }
  /* variable fill mode */
  .varmode { padding: 14px; display: none; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
  .varmode.show { display: flex; }
  .varmode h4 { font-size: 13px; color: var(--text2); font-weight: 600; }
  .vfield label { display: block; font-size: 11.5px; color: var(--text2); font-family: ui-monospace, monospace; margin-bottom: 3px; }
  .vfield input {
    width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; color: var(--text); font-size: 13px; outline: none;
  }
  .vfield input:focus { border-color: var(--accent); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="searchrow">
      <span class="icon">⌕</span>
      <input id="q" placeholder="Search prompts…" autofocus />
    </div>
    <div class="results" id="results"></div>
    <div class="varmode" id="varmode">
      <h4 id="varTitle"></h4>
      <div id="vfields"></div>
    </div>
    <div class="footer">
      <span><kbd>↑↓</kbd> <span id="fNav">navigate</span></span>
      <span><kbd>⏎</kbd> <span id="fCopy">copy</span></span>
      <span><kbd>⌘⏎</kbd> <span id="fOpen">open manager</span></span>
      <span><kbd>esc</kbd> <span id="fClose">close</span></span>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

const I18N = {
  en: { searchPh: "Search prompts…", nav: "navigate", copy: "copy",
        open: "open manager", close: "close", empty: "No prompts found",
        fill: "Fill variables for: " },
  ru: { searchPh: "Поиск промптов…", nav: "выбор", copy: "копировать",
        open: "открыть менеджер", close: "закрыть", empty: "Промпты не найдены",
        fill: "Заполни переменные: " },
};
let lang = "en";
const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
function applyLang() {
  $("q").placeholder = t("searchPh");
  $("fNav").textContent = t("nav");
  $("fCopy").textContent = t("copy");
  $("fOpen").textContent = t("open");
  $("fClose").textContent = t("close");
}

let prompts = [];
let filtered = [];
let sel = 0;
let varPrompt = null; // prompt being filled

function extractVariables(content) {
  const re = /\{\{\s*([^{}\n]+?)\s*\}\}/g;
  const vars = []; let m;
  while ((m = re.exec(content || "")) !== null) if (!vars.includes(m[1])) vars.push(m[1]);
  return vars;
}
function renderTemplate(content, values) {
  return content.replace(/\{\{\s*([^{}\n]+?)\s*\}\}/g,
    (f, n) => (n in values ? values[n] : f));
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

async function load() {
  const s = await window.api.getSettings();
  if (s.language !== lang) { lang = s.language || "en"; applyLang(); }
  prompts = await window.api.listPrompts();
  // favorites and most-used first
  prompts.sort((a,b) => (b.favorite - a.favorite) || ((b.usageCount||0) - (a.usageCount||0)));
  applyFilter();
}

function applyFilter() {
  const q = $("q").value.toLowerCase().trim();
  filtered = !q ? prompts : prompts.filter(p => {
    const hay = (p.title + "\n" + p.content + "\n" + (p.tags||[]).join(" ")).toLowerCase();
    return q.split(/\s+/).every(w => hay.includes(w));
  });
  sel = 0;
  render();
}

function render() {
  if (!filtered.length) {
    $("results").innerHTML = `<div class="empty">${t("empty")}</div>`;
    return;
  }
  $("results").innerHTML = filtered.map((p, i) => `
    <div class="row ${i===sel?'sel':''}" data-i="${i}">
      <div class="t">${p.favorite?'<span class="star">★</span>':''}${esc(p.title)}</div>
      <div class="p">${esc(String(p.content || "").replace(/\n/g,' '))}</div>
    </div>`).join("");
  const el = $("results").querySelector(".row.sel");
  if (el) el.scrollIntoView({ block: "nearest" });
}

function exitVarMode() {
  varPrompt = null;
  $("varmode").classList.remove("show");
  $("results").style.display = "";
  $("q").disabled = false;
  $("q").focus();
}

function choose(p) {
  const vars = extractVariables(p.content);
  if (!vars.length) {
    window.api.copyText(p.content, p.id);
    close();
    return;
  }
  varPrompt = p;
  $("varTitle").textContent = t("fill") + p.title;
  $("vfields").innerHTML = vars.map(v => `
    <div class="vfield">
      <label>{{${esc(v)}}}</label>
      <input data-var="${esc(v)}" />
    </div>`).join("");
  $("results").style.display = "none";
  $("q").disabled = true;
  $("varmode").classList.add("show");
  const f = $("vfields").querySelector("input");
  if (f) f.focus();
}

function copyVars() {
  const values = {};
  $("vfields").querySelectorAll("input").forEach(i => values[i.dataset.var] = i.value);
  window.api.copyText(renderTemplate(varPrompt.content, values), varPrompt.id);
  close();
}

function close() {
  exitVarMode();
  $("q").value = "";
  applyFilter();
  window.api.hidePalette();
}

$("q").addEventListener("input", applyFilter);

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    e.preventDefault();
    if (varPrompt) exitVarMode(); else close();
    return;
  }
  if (varPrompt) {
    if (e.key === "Enter") { e.preventDefault(); copyVars(); }
    return;
  }
  if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel+1, filtered.length-1); render(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel-1, 0); render(); }
  else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); window.api.openMain(); }
  else if (e.key === "Enter") { e.preventDefault(); if (filtered[sel]) choose(filtered[sel]); }
});

$("results").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  choose(filtered[Number(row.dataset.i)]);
});

window.api.onRefresh(() => {
  exitVarMode();
  $("q").value = "";
  load().then(() => $("q").focus());
});

load();
</script>
</body>
</html>
